<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Neon Teal Gradient -->
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Neon Blue Gradient -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Shield/Square Rounded Background -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="8" />

  <g filter="url(#glow)">
    <!-- Cyber Shield Outline in Background -->
    <path d="M 256,90 C 310,90 380,110 400,130 C 400,240 370,360 256,420 C 142,360 112,240 112,130 C 132,110 202,90 256,90 Z" 
          fill="none" stroke="url(#blue-grad)" stroke-width="6" opacity="0.3" stroke-dasharray="10 5" />
    
    <!-- Neural Network Nodes & Connections (Left Side) -->
    <g opacity="0.85">
      <line x1="140" y1="200" x2="180" y2="160" stroke="#2dd4bf" stroke-width="3" />
      <line x1="180" y1="160" x2="220" y2="210" stroke="#2dd4bf" stroke-width="3" />
      <line x1="140" y1="200" x2="160" y2="280" stroke="#2dd4bf" stroke-width="3" />
      <line x1="160" y1="280" x2="210" y2="290" stroke="#2dd4bf" stroke-width="3" />
      <line x1="180" y1="160" x2="160" y2="280" stroke="#2dd4bf" stroke-width="3" />
      <line x1="220" y1="210" x2="210" y2="290" stroke="#2dd4bf" stroke-width="3" />
      
      <!-- Glow Nodes -->
      <circle cx="140" cy="200" r="8" fill="#38bdf8" />
      <circle cx="180" cy="160" r="10" fill="#2dd4bf" />
      <circle cx="220" cy="210" r="7" fill="#38bdf8" />
      <circle cx="160" cy="280" r="9" fill="#2dd4bf" />
      <circle cx="210" cy="290" r="8" fill="#38bdf8" />
    </g>

    <!-- Stylized Letter 'A' -->
    <path d="M 256,120 L 370,370 L 320,370 L 256,230 L 192,370 L 142,370 Z" 
          fill="url(#teal-grad)" />
    
    <!-- Inner A bridge accent -->
    <path d="M 218,290 L 294,290 L 256,200 Z" 
          fill="#0f172a" />
          
    <path d="M 218,290 L 294,290 L 256,260 Z" 
          fill="url(#blue-grad)" />
  </g>
</svg>
